{% extends 'store/base.html' %}
{% load static %}

{% block title %}
Menu | Coffy Store
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'menu site/css/menu-style.css' %}">

<main class="menu-page">
  <section class="menu-banner">
    <div class="container">
      <h1>Our Menu</h1>
    </div>
  </section>

  <section class="menu-tools">
    <div class="container">
      <div class="tools-wrapper">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="menu-search" type="text" placeholder="Search your favorite treat...">
          <div id="search-suggestions" class="search-suggestions"></div>
        </div>
        <select id="category-filter">
          <option value="">All Categories</option>
          {% for category in categories %}
          <option value="{{ category.category_name }}">{{ category.category_name }}</option>
          {% endfor %}
        </select>
        <select id="sort-filter">
          <option value="">Sort By</option>
          <option value="price">Price</option>
          <option value="rating">Rating</option>
          <option value="favorites">Favorites</option>
        </select>
      </div>
    </div>

  </section>

  <section class="menu-products">
    <div class="container">
      {% csrf_token %}
      <div id="items-list" class="items-list">
        {% include 'store/components/menu_items.html' %}
      </div>

      {% include 'store/components/pagination.html' %}
    </div>
  </section>
</main>

<script>
  const searchInput = document.getElementById('menu-search');
  const categoryFilter = document.getElementById('category-filter');
  const sortFilter = document.getElementById('sort-filter');
  const suggestionsBox = document.getElementById('search-suggestions');
  const itemsList = document.getElementById('items-list');
  const pagination = document.getElementById('menu-pagination');
  const menuUrl = '{% url "menu" %}';
  const suggestionsUrl = '{% url "search_suggestions" %}';
  const loginUrl = '{% url "login" %}';
  const isAuthenticated = "{{ request.user.is_authenticated|yesno:'true,false' }}" === "true";


  function toggleFavoriteUrl(product_id) {
    return `/favorites/toggle/${product_id}/`;
  }

  async function handleFavoriteClick(button) {
    console.log("Favorite clicked");

    if (!isAuthenticated) {
      window.location.href = loginUrl;
      return;
    }

    if (button.dataset.loading === 'true') {
      return; // ignore rapid repeat clicks while a request is in flight
    }
    button.dataset.loading = 'true';
    button.disabled = true;

    const productId = button.dataset.productId;
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    try {
      const response = await fetch(toggleFavoriteUrl(productId), {
        method: 'POST',
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': csrfToken,
        },
      });

      const data = await response.json();
      if (data.success) {
        button.classList.toggle('active', data.favorite);

        const countEl = button.closest('.menu-item')?.querySelector('[data-favorites-count]');
        if (countEl) {
          const current = parseInt(countEl.textContent.trim(), 10) || 0;
          countEl.innerHTML = `<i class="fa-solid fa-heart"></i> ${current + (data.favorite ? 1 : -1)}`;
        }
      }
    } finally {
      button.dataset.loading = 'false';
      button.disabled = false;
    }
  }

  function attachFavoriteHandlers() {
    itemsList.querySelectorAll('.favorite-btn').forEach(button => {
      button.addEventListener('click', () => handleFavoriteClick(button));
    });
  }

  attachFavoriteHandlers();

  function buildUrl(page = null) {
    const query = searchInput.value.trim();
    const category = categoryFilter.value;
    const sort = sortFilter.value;
    const params = new URLSearchParams({ ajax: '1' });

    if (query) params.set('q', query);
    if (category && category !== 'All Categories') params.set('category', category);
    if (sort) params.set('sort', sort);
    if (page) params.set('page', page);
    return `${menuUrl}?${params.toString()}`;
  }

  function updatePaginationState(currentPage) {
    if (!pagination) return;

    pagination.querySelectorAll('.pagination-link').forEach(button => {
      const buttonPage = Number(button.dataset.page);
      button.classList.toggle('active', !Number.isNaN(buttonPage) && buttonPage === currentPage);
    });
  }

  async function refreshMenu(page = null) {
    const response = await fetch(buildUrl(page), { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
    const data = await response.json();
    if (data.success) {
      itemsList.innerHTML = data.items_html;
      attachFavoriteHandlers();
      if (pagination) {
        pagination.innerHTML = data.pagination_html || pagination.innerHTML;
        pagination.dataset.page = data.page || 1;
        updatePaginationState(Number(data.page || 1));
        attachPaginationHandlers();
      }
    }
  }

  async function refreshSuggestions() {
    const query = searchInput.value.trim();
    if (!query) {
      suggestionsBox.innerHTML = '';
      return;
    }

    const response = await fetch(`${suggestionsUrl}?q=${encodeURIComponent(query)}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
    const data = await response.json();
    if (!data.success) {
      return;
    }

    suggestionsBox.innerHTML = data.suggestions.map(item => `<button type="button" class="suggestion-item" data-title="${item.title}">${item.title} · ${item.category}</button>`).join('');

    suggestionsBox.querySelectorAll('.suggestion-item').forEach(button => {
      button.addEventListener('click', () => {
        searchInput.value = button.dataset.title;
        suggestionsBox.innerHTML = '';
        refreshMenu();
      });
    });
  }

  let debounceTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      refreshSuggestions();
      refreshMenu();
    }, 200);
  });

  categoryFilter.addEventListener('change', () => refreshMenu());
  sortFilter.addEventListener('change', () => refreshMenu());

  function attachPaginationHandlers() {
    pagination?.querySelectorAll('.pagination-link').forEach(button => {
      button.addEventListener('click', () => {
        const page = button.dataset.page;
        if (page) {
          refreshMenu(page);
        }
      });
    });
  }

  attachPaginationHandlers();
</script>
{% endblock %}
